<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Staff Create — Scholaro ERP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *{box-sizing:border-box;}body{font-family:'Inter',sans-serif;background:#f1f5f9;margin:0;}
        .form-wrap{max-width:700px;margin:40px auto;padding:0 16px 60px;}
        .form-card{background:white;border-radius:20px;overflow:hidden;box-shadow:0 4px 24px rgba(0,0,0,.09);border:1px solid #e2e8f0;}
        .card-header-grad{background:linear-gradient(135deg,#1e1b4b,#312e81,#4f46e5);padding:28px 32px;color:white;}
        .card-header-grad h3{font-size:1.4rem;font-weight:800;margin:0;}
        .card-header-grad small{opacity:.8;font-size:.88rem;}
        .card-body-pad{padding:32px;}
        .form-label{font-weight:600;font-size:.85rem;color:#374151;margin-bottom:6px;}
        .form-control,.form-select{border:1.5px solid #e2e8f0;border-radius:10px;padding:10px 14px;font-size:.9rem;transition:all .2s;background:#f8fafc;font-family:'Inter',sans-serif;}
        .form-control:focus,.form-select:focus{border-color:#4f46e5;box-shadow:0 0 0 3px rgba(79,70,229,.12);background:white;outline:none;}
        .btn-submit{background:linear-gradient(135deg,#4f46e5,#6366f1);color:white;border:none;border-radius:10px;padding:12px 24px;font-size:.9rem;font-weight:600;cursor:pointer;transition:all .2s;font-family:'Inter',sans-serif;}
        .btn-submit:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(79,70,229,.4);}
        .btn-cancel{background:#f1f5f9;color:#64748b;border:1.5px solid #e2e8f0;border-radius:10px;padding:12px 24px;font-size:.9rem;font-weight:600;text-decoration:none;display:inline-block;transition:all .2s;text-align:center;}
        .btn-cancel:hover{background:#e2e8f0;color:#374151;}
        .alert{border-radius:10px;border:none;border-left:4px solid;font-size:.875rem;}
        .section-label{font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#94a3b8;margin-bottom:12px;margin-top:4px;}
    </style>
</head>
<body>
<div class="form-wrap">
    <div class="form-card">
        <div class="card-header-grad d-flex justify-content-between align-items-center">
            <div>
                <h3><i class="bi bi-person-badge-fill me-2"></i>Create Staff Profile</h3>
                <small>Select user and assign staff role</small>
            </div>
            <a href="{% url 'staff:staff_list' %}" style="background:rgba(255,255,255,.15);color:white;border:1px solid rgba(255,255,255,.25);border-radius:10px;padding:7px 16px;font-size:.82rem;text-decoration:none;"><i class="bi bi-arrow-left me-1"></i>Back</a>
        </div>
        <div class="card-body-pad">
            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags }} alert-dismissible fade show mb-4">
                        {{ message }}<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                {% endfor %}
            {% endif %}

            <form method="POST">
                {% csrf_token %}
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Select User</label>
                        {{ form.user }}
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Designation Name</label>
                        {{ form.designation }}
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Department</label>
                        {{ form.department }}
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Phone</label>
                        {{ form.phone }}
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Salary</label>
                        {{ form.salary }}
                    </div>
                    <div class="col-12">
                        <label class="form-label">Address</label>
                        {{ form.address }}
                    </div>
                </div>
                <div class="d-flex gap-3 mt-4">
                    <button type="submit" class="btn-submit flex-grow-1"><i class="bi bi-check-lg me-1"></i>Staff Create</button>
                    <a href="{% url 'staff:staff_list' %}" class="btn-cancel flex-grow-1">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
