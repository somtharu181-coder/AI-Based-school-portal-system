<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Exam Terms Create — Scholaro ERP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *{box-sizing:border-box;}body{font-family:'Inter',sans-serif;background:#f1f5f9;margin:0;}
        .form-wrap{max-width:580px;margin:40px auto;padding:0 16px 60px;}
        .form-card{background:white;border-radius:20px;overflow:hidden;box-shadow:0 4px 24px rgba(0,0,0,.09);border:1px solid #e2e8f0;}
        .card-header-grad{background:linear-gradient(135deg,#7f1d1d,#b91c1c,#ef4444);padding:28px 32px;color:white;}
        .card-header-grad h3{font-size:1.4rem;font-weight:800;margin:0;}
        .card-header-grad small{opacity:.8;font-size:.88rem;}
        .card-body-pad{padding:32px;}
        .form-label{font-weight:600;font-size:.85rem;color:#374151;margin-bottom:6px;}
        .form-control,.form-select{border:1.5px solid #e2e8f0;border-radius:10px;padding:10px 14px;font-size:.9rem;transition:all .2s;background:#f8fafc;font-family:'Inter',sans-serif;}
        .form-control:focus,.form-select:focus{border-color:#ef4444;box-shadow:0 0 0 3px rgba(239,68,68,.12);background:white;outline:none;}
        .form-check-input:checked{background-color:#ef4444;border-color:#ef4444;}
        .btn-submit{background:linear-gradient(135deg,#ef4444,#dc2626);color:white;border:none;border-radius:10px;padding:12px 24px;font-size:.9rem;font-weight:600;width:100%;cursor:pointer;transition:all .2s;font-family:'Inter',sans-serif;}
        .btn-submit:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(239,68,68,.4);}
        .btn-cancel{background:#f1f5f9;color:#64748b;border:1.5px solid #e2e8f0;border-radius:10px;padding:12px 24px;font-size:.9rem;font-weight:600;text-decoration:none;display:inline-block;transition:all .2s;text-align:center;}
        .btn-cancel:hover{background:#e2e8f0;color:#374151;}
        .empty-notice{color:#94a3b8;font-size:.85rem;font-style:italic;}
        .alert{border-radius:10px;border:none;border-left:4px solid;font-size:.875rem;}
    </style>
</head>
<body>
<div class="form-wrap">
    <div class="form-card">
        <div class="card-header-grad d-flex justify-content-between align-items-center">
            <div>
                <h3><i class="bi bi-calendar3 me-2"></i>Exam Terms Create</h3>
                <small>Schedule a new exam term for an academic year</small>
            </div>
            <a href="{% url 'academics:exam_term_list' %}" style="background:rgba(255,255,255,.15);color:white;border:1px solid rgba(255,255,255,.25);border-radius:10px;padding:7px 16px;font-size:.82rem;text-decoration:none;"><i class="bi bi-arrow-left me-1"></i>Back</a>
        </div>
        <div class="card-body-pad">
            {% if messages %}
                {% for m in messages %}
                    <div class="alert alert-{{ m.tags|default:'danger' }} alert-dismissible fade show mb-4">
                        {{ m }}<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                {% endfor %}
            {% endif %}

            <form method="POST" novalidate>
                {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label">Academic Year <span class="text-danger">*</span></label>
                    {% if academic_years %}
                        <select class="form-select" name="academic_year" required>
                            <option value="">— Select Academic Year —</option>
                            {% for yr in academic_years %}
                                <option value="{{ yr.id }}">{{ yr.name }}{% if yr.is_current %} (Current){% endif %}</option>
                            {% endfor %}
                        </select>
                    {% else %}
                        <div class="form-control bg-light empty-notice">No academic years found. <a href="{% url 'academics:create_academic_year' %}">Create one first.</a></div>
                        <input type="hidden" name="academic_year" value="">
                    {% endif %}
                </div>

                <div class="mb-3">
                    <label class="form-label">Term Name <span class="text-danger">*</span></label>
                    <input class="form-control" name="name" placeholder="e.g. First Term 2024" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Term Type <span class="text-danger">*</span></label>
                    <select class="form-select" name="term_type" required>
                        <option value="">— Select Type —</option>
                        {% for val, label in term_types %}
                            <option value="{{ val }}">{{ label }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label class="form-label">Start Date <span class="text-danger">*</span></label>
                        <input class="form-control" type="date" name="start_date" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">End Date <span class="text-danger">*</span></label>
                        <input class="form-control" type="date" name="end_date" required>
                        <div class="form-text text-danger" id="date-err" style="display:none;">End date must be after start date.</div>
                    </div>
                </div>

                <div class="mb-4 form-check">
                    <input type="checkbox" class="form-check-input" name="is_published" id="is_published">
                    <label class="form-check-label" for="is_published" style="font-size:.875rem;color:#374151;">
                        Publish immediately <small class="text-muted">(students can see published results)</small>
                    </label>
                </div>

                <div class="d-flex gap-3">
                    <button type="submit" class="btn-submit flex-grow-1"><i class="bi bi-check-lg me-1"></i>Exam Terms Create</button>
                    <a href="{% url 'academics:exam_term_list' %}" class="btn-cancel flex-grow-1">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
document.querySelector("form").addEventListener("submit", function(e) {
    var s = this.querySelector('[name="start_date"]').value;
    var d = this.querySelector('[name="end_date"]').value;
    var err = document.getElementById("date-err");
    if (s && d && d <= s) { err.style.display = "block"; e.preventDefault(); }
    else { err.style.display = "none"; }
});
</script>
</body>
</html>
