<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Enter Marks — Select Class &amp; Term</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *{box-sizing:border-box;}body{font-family:'Inter',sans-serif;background:#f1f5f9;margin:0;}
        .page-header{background:linear-gradient(135deg,#1e1b4b,#312e81,#4f46e5);color:white;padding:26px 32px;border-radius:0 0 24px 24px;margin-bottom:32px;box-shadow:0 8px 32px rgba(79,70,229,.3);}
        .page-header h4{font-size:1.5rem;font-weight:800;margin:0;}
        .page-header small{opacity:.8;font-size:.88rem;}
        .select-card{background:white;border-radius:20px;padding:36px;box-shadow:0 4px 24px rgba(0,0,0,.09);border:1px solid #e2e8f0;max-width:620px;margin:0 auto;}
        .step-badge{background:linear-gradient(135deg,#4f46e5,#6366f1);color:white;width:32px;height:32px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;margin-right:10px;flex-shrink:0;}
        .step-title{font-size:1.1rem;font-weight:700;color:#1e293b;display:flex;align-items:center;margin-bottom:24px;}
        .form-label{font-weight:600;font-size:.85rem;color:#374151;margin-bottom:6px;}
        .form-control,.form-select{border:1.5px solid #e2e8f0;border-radius:10px;padding:10px 14px;font-size:.9rem;transition:all .2s;background:#f8fafc;font-family:'Inter',sans-serif;}
        .form-control:focus,.form-select:focus{border-color:#4f46e5;box-shadow:0 0 0 3px rgba(79,70,229,.12);background:white;outline:none;}
        .btn-next{background:linear-gradient(135deg,#4f46e5,#6366f1);color:white;border:none;border-radius:10px;padding:12px 24px;font-size:.9rem;font-weight:600;cursor:pointer;transition:all .2s;font-family:'Inter',sans-serif;}
        .btn-next:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(79,70,229,.4);}
        .btn-cancel{background:#f1f5f9;color:#64748b;border:1.5px solid #e2e8f0;border-radius:10px;padding:12px 24px;font-size:.9rem;font-weight:600;text-decoration:none;display:inline-block;transition:all .2s;text-align:center;}
        .btn-cancel:hover{background:#e2e8f0;color:#374151;}
        .empty-notice{color:#94a3b8;font-size:.85rem;font-style:italic;}
    </style>
</head>
<body>

<div class="page-header d-flex justify-content-between align-items-center">
    <div>
        <h4><i class="bi bi-pencil-square me-2"></i>Enter Student marks</h4>
        <small>Select a section and exam term to begin entering marks</small>
    </div>
    <a href="{% url 'accounts:staff_dashboard' %}" style="background:rgba(255,255,255,.15);color:white;border:1px solid rgba(255,255,255,.25);border-radius:10px;padding:8px 18px;font-size:.85rem;text-decoration:none;"><i class="bi bi-arrow-left me-1"></i>Dashboard</a>
</div>

<div class="container pb-5">
    <div class="select-card">
        <div class="step-title">
            <span class="step-badge">1</span>
            Select Section &amp; Exam Terms
        </div>

        <form method="GET" action="{% url 'academics:marks_entry' %}">

            <div class="mb-3">
                <label class="form-label">Class</label>
                <select id="class-select" class="form-select">
                    <option value="">— Select Class —</option>
                    {% for c in classes %}<option value="{{ c.id }}">{{ c.name }}</option>{% endfor %}
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Section <span class="text-danger">*</span></label>
                {% if sections %}
                    <select id="section-select" name="section_id" class="form-select" required>
                        <option value="">— Select Section —</option>
                        {% for s in sections %}
                            <option value="{{ s.id }}" data-class="{{ s.class_obj.id }}">{{ s.class_obj.name }} — {{ s.name }}</option>
                        {% endfor %}
                    </select>
                {% else %}
                    <div class="form-control bg-light empty-notice">No sections found.</div>
                {% endif %}
            </div>

            <div class="mb-4">
                <label class="form-label">Exam Terms <span class="text-danger">*</span></label>
                {% if exam_terms %}
                    <select name="term_id" class="form-select" required>
                        <option value="">— Select Exam Terms —</option>
                        {% for term in exam_terms %}
                            <option value="{{ term.id }}">{{ term.name }} ({{ term.academic_year.name }})</option>
                        {% endfor %}
                    </select>
                {% else %}
                    <div class="form-control bg-light empty-notice">No exam terms found. <a href="{% url 'academics:academic_dashboard' %}">Create an academic year first.</a></div>
                {% endif %}
            </div>

            <div class="d-flex gap-3">
                <button type="submit" class="btn-next flex-grow-1"><i class="bi bi-arrow-right me-1"></i>Next — Load Students &amp; Subjects</button>
                <a href="{% url 'academics:academic_dashboard' %}" class="btn-cancel">Cancel</a>
            </div>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
var classSelect = document.getElementById("class-select");
var sectionSelect = document.getElementById("section-select");
if (classSelect && sectionSelect) {
    var allOptions = Array.from(sectionSelect.options).slice(1);
    classSelect.addEventListener("change", function() {
        var classId = this.value;
        while (sectionSelect.options.length > 1) { sectionSelect.remove(1); }
        allOptions.forEach(function(opt) {
            if (!classId || opt.getAttribute("data-class") === classId) {
                sectionSelect.appendChild(opt.cloneNode(true));
            }
        });
    });
}
</script>
</body>
</html>
