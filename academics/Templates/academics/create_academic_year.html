<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Academic Year Create — Scholaro ERP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *{box-sizing:border-box;}body{font-family:'Inter',sans-serif;background:#f1f5f9;margin:0;}
        .form-wrap{max-width:560px;margin:40px auto;padding:0 16px 60px;}
        .form-card{background:white;border-radius:20px;overflow:hidden;box-shadow:0 4px 24px rgba(0,0,0,.09);border:1px solid #e2e8f0;}
        .card-header-grad{background:linear-gradient(135deg,#1e1b4b,#312e81,#4f46e5);padding:28px 32px;color:white;}
        .card-header-grad h3{font-size:1.4rem;font-weight:800;margin:0;}
        .card-header-grad small{opacity:.8;font-size:.88rem;}
        .card-body-pad{padding:32px;}
        .form-label{font-weight:600;font-size:.85rem;color:#374151;margin-bottom:6px;}
        .form-control,.form-select{border:1.5px solid #e2e8f0;border-radius:10px;padding:10px 14px;font-size:.9rem;transition:all .2s;background:#f8fafc;font-family:'Inter',sans-serif;}
        .form-control:focus,.form-select:focus{border-color:#4f46e5;box-shadow:0 0 0 3px rgba(79,70,229,.12);background:white;outline:none;}
        .form-check-input:checked{background-color:#4f46e5;border-color:#4f46e5;}
        .btn-submit{background:linear-gradient(135deg,#4f46e5,#6366f1);color:white;border:none;border-radius:10px;padding:12px 24px;font-size:.9rem;font-weight:600;width:100%;cursor:pointer;transition:all .2s;font-family:'Inter',sans-serif;}
        .btn-submit:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(79,70,229,.4);}
        .btn-cancel{background:#f1f5f9;color:#64748b;border:1.5px solid #e2e8f0;border-radius:10px;padding:12px 24px;font-size:.9rem;font-weight:600;text-decoration:none;display:inline-block;transition:all .2s;text-align:center;}
        .btn-cancel:hover{background:#e2e8f0;color:#374151;}
        .alert{border-radius:10px;border:none;border-left:4px solid;font-size:.875rem;}
    </style>
</head>
<body>
<div class="form-wrap">
    <div class="form-card">
        <div class="card-header-grad d-flex justify-content-between align-items-center">
            <div>
                <h3><i class="bi bi-calendar-range me-2"></i>Academic Year Create</h3>
                <small>Define a new academic year for the school</small>
            </div>
            <a href="{% url 'academics:academic_dashboard' %}" style="background:rgba(255,255,255,.15);color:white;border:1px solid rgba(255,255,255,.25);border-radius:10px;padding:7px 16px;font-size:.82rem;text-decoration:none;"><i class="bi bi-arrow-left me-1"></i>Back</a>
        </div>
        <div class="card-body-pad">
            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags|default:'danger' }} alert-dismissible fade show mb-4">
                        {{ message }}<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                {% endfor %}
            {% endif %}

            <form method="POST" novalidate>
                {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label">Year Name <span class="text-danger">*</span></label>
                    <input class="form-control" name="name" placeholder="e.g. 2024-2025" required>
                    <div class="form-text text-muted" style="font-size:.8rem;">Enter a unique name for this academic year.</div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Start Date <span class="text-danger">*</span></label>
                    <input class="form-control" type="date" name="start_date" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">End Date <span class="text-danger">*</span></label>
                    <input class="form-control" type="date" name="end_date" required>
                    <div class="form-text text-danger" id="date-error" style="display:none;">End date must be after start date.</div>
                </div>

                <div class="mb-4 form-check">
                    <input type="checkbox" class="form-check-input" name="is_current" id="is_current">
                    <label class="form-check-label" for="is_current" style="font-size:.875rem;color:#374151;">
                        Set as Current Year <small class="text-muted">(will unset any existing current year)</small>
                    </label>
                </div>

                <div class="d-flex gap-3">
                    <button type="submit" class="btn-submit flex-grow-1"><i class="bi bi-check-lg me-1"></i>Academic Year Create</button>
                    <a href="{% url 'academics:academic_dashboard' %}" class="btn-cancel flex-grow-1">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
document.querySelector("form").addEventListener("submit", function(e) {
    var name = this.querySelector('[name="name"]').value.trim();
    var startDate = this.querySelector('[name="start_date"]').value;
    var endDate = this.querySelector('[name="end_date"]').value;
    var errEl = document.getElementById("date-error");
    var valid = true;
    if (!name) { alert("Year Name is required."); valid = false; }
    else if (!startDate) { alert("Start Date is required."); valid = false; }
    else if (!endDate) { alert("End Date is required."); valid = false; }
    else if (endDate <= startDate) { errEl.style.display = "block"; valid = false; }
    else { errEl.style.display = "none"; }
    if (!valid) { e.preventDefault(); }
});
</script>
</body>
</html>
