<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Update Student — Scholaro ERP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *{box-sizing:border-box;}body{font-family:'Inter',sans-serif;background:#f1f5f9;margin:0;}
        .form-wrap{max-width:680px;margin:40px auto;padding:0 16px 60px;}
        .form-card{background:white;border-radius:20px;overflow:hidden;box-shadow:0 4px 24px rgba(0,0,0,.09);border:1px solid #e2e8f0;}
        .card-header-grad{background:linear-gradient(135deg,#064e3b,#065f46,#10b981);padding:28px 32px;color:white;}
        .card-header-grad h3{font-size:1.4rem;font-weight:800;margin:0;}
        .card-header-grad small{opacity:.8;font-size:.88rem;}
        .card-body-pad{padding:32px;}
        .form-label{font-weight:600;font-size:.85rem;color:#374151;margin-bottom:6px;}
        .form-control,.form-select{border:1.5px solid #e2e8f0;border-radius:10px;padding:10px 14px;font-size:.9rem;transition:all .2s;background:#f8fafc;font-family:'Inter',sans-serif;}
        .form-control:focus,.form-select:focus{border-color:#10b981;box-shadow:0 0 0 3px rgba(16,185,129,.12);background:white;outline:none;}
        .btn-submit{background:linear-gradient(135deg,#10b981,#059669);color:white;border:none;border-radius:10px;padding:12px 24px;font-size:.9rem;font-weight:600;cursor:pointer;transition:all .2s;font-family:'Inter',sans-serif;}
        .btn-submit:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(16,185,129,.4);}
        .btn-cancel{background:#f1f5f9;color:#64748b;border:1.5px solid #e2e8f0;border-radius:10px;padding:12px 24px;font-size:.9rem;font-weight:600;text-decoration:none;display:inline-block;transition:all .2s;text-align:center;}
        .btn-cancel:hover{background:#e2e8f0;color:#374151;}
        p label{font-weight:600;font-size:.85rem;color:#374151;}
        p input,p select,p textarea{border:1.5px solid #e2e8f0;border-radius:10px;padding:10px 14px;font-size:.9rem;width:100%;background:#f8fafc;font-family:'Inter',sans-serif;transition:all .2s;}
        p input:focus,p select:focus,p textarea:focus{border-color:#10b981;box-shadow:0 0 0 3px rgba(16,185,129,.12);background:white;outline:none;}
    </style>
</head>
<body>
<div class="form-wrap">
    <div class="form-card">
        <div class="card-header-grad d-flex justify-content-between align-items-center">
            <div>
                <h3><i class="bi bi-pencil-fill me-2"></i>Update Student</h3>
                <small>Edit student profile information</small>
            </div>
            <a href="{% url 'students:student_list' %}" style="background:rgba(255,255,255,.15);color:white;border:1px solid rgba(255,255,255,.25);border-radius:10px;padding:7px 16px;font-size:.82rem;text-decoration:none;"><i class="bi bi-arrow-left me-1"></i>Back</a>
        </div>
        <div class="card-body-pad">
            <form method="POST">
                {% csrf_token %}
                {{ form.as_p }}
                <div class="d-flex gap-3 mt-4">
                    <button type="submit" class="btn-submit flex-grow-1"><i class="bi bi-check-lg me-1"></i>Update</button>
                    <a href="{% url 'students:student_list' %}" class="btn-cancel flex-grow-1">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
