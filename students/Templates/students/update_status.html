<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Update Student Status — Scholaro ERP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *{box-sizing:border-box;}body{font-family:'Inter',sans-serif;background:#f1f5f9;margin:0;}
        .wrap{max-width:480px;margin:80px auto;padding:0 16px;}
        .card{background:white;border-radius:20px;overflow:hidden;box-shadow:0 4px 24px rgba(0,0,0,.09);border:1px solid #e2e8f0;}
        .card-header-grad{background:linear-gradient(135deg,#0c4a6e,#0369a1,#06b6d4);padding:26px 28px;color:white;}
        .card-header-grad h3{font-size:1.3rem;font-weight:800;margin:0;}
        .card-header-grad small{opacity:.8;font-size:.85rem;}
        .card-body-pad{padding:28px;}
        .form-label{font-weight:600;font-size:.85rem;color:#374151;margin-bottom:6px;}
        .form-select{border:1.5px solid #e2e8f0;border-radius:10px;padding:10px 14px;font-size:.9rem;transition:all .2s;background:#f8fafc;font-family:'Inter',sans-serif;width:100%;}
        .form-select:focus{border-color:#06b6d4;box-shadow:0 0 0 3px rgba(6,182,212,.12);background:white;outline:none;}
        .btn-submit{background:linear-gradient(135deg,#06b6d4,#0891b2);color:white;border:none;border-radius:10px;padding:12px 24px;font-size:.9rem;font-weight:600;cursor:pointer;transition:all .2s;font-family:'Inter',sans-serif;}
        .btn-submit:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(6,182,212,.4);}
        .btn-cancel{background:#f1f5f9;color:#64748b;border:1.5px solid #e2e8f0;border-radius:10px;padding:12px 24px;font-size:.9rem;font-weight:600;text-decoration:none;display:inline-block;transition:all .2s;text-align:center;}
        .btn-cancel:hover{background:#e2e8f0;color:#374151;}
    </style>
</head>
<body>
<div class="wrap">
    <div class="card">
        <div class="card-header-grad">
            <h3><i class="bi bi-toggle-on me-2"></i>Update Status</h3>
            <small>{{ student.name|default:student }}</small>
        </div>
        <div class="card-body-pad">
            <form method="POST">
                {% csrf_token %}
                <div class="mb-4">
                    {{ form.status.label_tag }}
                    {{ form.status }}
                </div>
                <div class="d-flex gap-3">
                    <button type="submit" class="btn-submit flex-grow-1"><i class="bi bi-check-lg me-1"></i>Update Status</button>
                    <a href="{% url 'students:student_list' %}" class="btn-cancel flex-grow-1">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
