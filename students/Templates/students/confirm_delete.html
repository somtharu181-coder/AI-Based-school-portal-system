<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Delete Student — Scholaro ERP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *{box-sizing:border-box;}body{font-family:'Inter',sans-serif;background:#f1f5f9;margin:0;}
        .wrap{max-width:480px;margin:80px auto;padding:0 16px;}
        .card{background:white;border-radius:20px;overflow:hidden;box-shadow:0 4px 24px rgba(0,0,0,.09);border:1px solid #e2e8f0;}
        .card-header-danger{background:linear-gradient(135deg,#7f1d1d,#b91c1c,#ef4444);padding:28px;color:white;text-align:center;}
        .danger-icon{width:64px;height:64px;background:rgba(255,255,255,.15);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;font-size:1.8rem;}
        .card-header-danger h3{font-size:1.3rem;font-weight:800;margin:0;}
        .card-body-pad{padding:28px;}
        .student-box{background:#fef2f2;border:1px solid #fecaca;border-radius:12px;padding:14px 18px;margin-bottom:24px;text-align:center;}
        .student-box strong{font-size:1rem;color:#991b1b;font-weight:700;}
        .warning-text{color:#64748b;font-size:.875rem;text-align:center;margin-bottom:24px;}
        .btn-delete{background:linear-gradient(135deg,#ef4444,#dc2626);color:white;border:none;border-radius:10px;padding:12px 24px;font-size:.9rem;font-weight:600;cursor:pointer;transition:all .2s;font-family:'Inter',sans-serif;}
        .btn-delete:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(239,68,68,.4);}
        .btn-cancel{background:#f1f5f9;color:#64748b;border:1.5px solid #e2e8f0;border-radius:10px;padding:12px 24px;font-size:.9rem;font-weight:600;text-decoration:none;display:inline-block;transition:all .2s;text-align:center;}
        .btn-cancel:hover{background:#e2e8f0;color:#374151;}
    </style>
</head>
<body>
<div class="wrap">
    <div class="card">
        <div class="card-header-danger">
            <div class="danger-icon"><i class="bi bi-exclamation-triangle-fill"></i></div>
            <h3>Delete Student</h3>
        </div>
        <div class="card-body-pad">
            <div class="student-box">
                <strong>{{ student.name|default:student }}</strong>
            </div>
            <p class="warning-text">Are you sure you want to permanently delete this student? This action <strong>cannot be undone</strong>.</p>
            <form method="POST">
                {% csrf_token %}
                <div class="d-flex gap-3">
                    <button type="submit" class="btn-delete flex-grow-1"><i class="bi bi-trash-fill me-1"></i>Yes, Delete</button>
                    <a href="{% url 'students:student_list' %}" class="btn-cancel flex-grow-1">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
