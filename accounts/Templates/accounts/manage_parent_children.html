{% load static %}<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"><title>Parent Children Manage</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>body{font-family:'Inter',sans-serif;background:#0f172a;color:#e2e8f0;margin:0;}
.ph{background:linear-gradient(135deg,#1e1b4b,#1e3a5f,#0f172a);padding:20px 32px;border-bottom:1px solid #1e40af;margin-bottom:24px;}
.cd{background:#1e293b;border:1px solid #334155;border-radius:14px;padding:24px;}
.inp{background:#0f172a;border:1px solid #334155;color:#e2e8f0;border-radius:8px;padding:9px 12px;font-size:.875rem;width:100%;}
.inp:focus{outline:none;border-color:#4f46e5;}
.st-row{background:#0f172a;border:1px solid #334155;border-radius:8px;padding:9px 12px;margin-bottom:6px;display:flex;align-items:center;gap:10px;cursor:pointer;}
.st-row:hover{border-color:#4f46e5;}
.st-row input{accent-color:#4f46e5;width:16px;height:16px;}
</style></head><body>
<div class="ph d-flex align-items-center gap-3">
  <a href="{% url 'accounts:create_parent_account' %}" style="background:#1e293b;color:#94a3b8;border:1px solid #334155;padding:7px 16px;border-radius:9px;text-decoration:none;font-size:.82rem;">← Back</a>
  <div><h4 style="margin:0;font-size:1.1rem;font-weight:800;color:white;">Edit Children — {{ profile.user.username }}</h4>
  <p style="margin:0;font-size:.78rem;color:#475569;">Select all students linked to this parent</p></div>
</div>
<div class="container pb-5" style="max-width:720px;">
  <div class="cd">
    <form method="POST">{% csrf_token %}
      <div style="max-height:420px;overflow-y:auto;border:1px solid #334155;border-radius:8px;padding:8px;margin-bottom:16px;">
        {% for stu in students %}
        <label class="st-row">
          <input type="checkbox" name="student_ids" value="{{ stu.pk }}" {% if stu.pk in current %}checked{% endif %}>
          <div>
            <div style="font-size:.875rem;font-weight:600;color:#e2e8f0;">{{ stu.name|default:"Unnamed" }}</div>
            <small style="color:#64748b;">{{ stu.section.class_obj.name }} — {{ stu.section.name }} | Roll {{ stu.roll_number }}</small>
          </div>
        </label>
        {% empty %}<p style="color:#475569;font-size:.85rem;">No students found.</p>{% endfor %}
      </div>
      <button type="submit" style="background:#4f46e5;color:white;border:none;padding:11px 24px;border-radius:10px;font-size:.9rem;font-weight:700;cursor:pointer;width:100%;">Save Changes</button>
    </form>
  </div>
</div></body></html>
