{% load static %}<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Quiz</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>body{font-family:'Inter',sans-serif;background:#0f172a;color:#e2e8f0;margin:0;}
.ph{background:linear-gradient(135deg,#1e1b4b,#1e3a5f,#0f172a);padding:16px 32px;border-bottom:1px solid #1e40af;margin-bottom:24px;}
.opt{background:#0f172a;border:1.5px solid #334155;border-radius:10px;padding:14px 18px;margin-bottom:10px;cursor:pointer;transition:.2s;display:block;width:100%;text-align:left;color:#e2e8f0;font-size:.9rem;}
.opt:hover{border-color:#4f46e5;background:rgba(79,70,229,.1);}
.pbar{height:6px;border-radius:3px;background:#334155;overflow:hidden;margin-bottom:20px;}
.pfill{height:100%;border-radius:3px;background:linear-gradient(90deg,#4f46e5,#06b6d4);}
</style></head><body>
<div class="ph d-flex justify-content-between align-items-center">
  <div>
    <span style="font-size:.78rem;color:#475569;">Question {{ answered|add:1 }} of {{ total }}</span>
    <div class="pbar mt-1" style="width:200px;"><div class="pfill" style="width:{{ progress }}%;"></div></div>
  </div>
  <a href="{% url 'quiz:finish' session.pk %}" style="background:rgba(248,113,113,.15);color:#f87171;border:1px solid rgba(248,113,113,.3);padding:6px 14px;border-radius:8px;text-decoration:none;font-size:.78rem;">Finish &amp; Submit</a>
</div>
<div class="container pb-5" style="max-width:700px;">
  <div style="background:#1e293b;border:1px solid #334155;border-radius:14px;padding:28px;">
    <div style="font-size:.72rem;color:#475569;margin-bottom:8px;text-transform:uppercase;letter-spacing:.06em;">{{ question.chapter }}</div>
    <div style="font-size:1.05rem;font-weight:600;color:#e2e8f0;margin-bottom:24px;line-height:1.6;">{{ question.text }}</div>
    <form method="POST" action="{% url 'quiz:answer' question.pk %}">{% csrf_token %}
      <button type="submit" name="chosen" value="A" class="opt"><span style="background:#4f46e5;color:white;padding:2px 8px;border-radius:5px;font-size:.75rem;font-weight:700;margin-right:10px;">A</span>{{ question.option_a }}</button>
      <button type="submit" name="chosen" value="B" class="opt"><span style="background:#4f46e5;color:white;padding:2px 8px;border-radius:5px;font-size:.75rem;font-weight:700;margin-right:10px;">B</span>{{ question.option_b }}</button>
      <button type="submit" name="chosen" value="C" class="opt"><span style="background:#4f46e5;color:white;padding:2px 8px;border-radius:5px;font-size:.75rem;font-weight:700;margin-right:10px;">C</span>{{ question.option_c }}</button>
      <button type="submit" name="chosen" value="D" class="opt"><span style="background:#4f46e5;color:white;padding:2px 8px;border-radius:5px;font-size:.75rem;font-weight:700;margin-right:10px;">D</span>{{ question.option_d }}</button>
    </form>
  </div>
</div></body></html>
