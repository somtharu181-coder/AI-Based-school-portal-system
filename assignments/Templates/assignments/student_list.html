{% load static %}<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>My Assignments</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<style>*{box-sizing:border-box;}body{font-family:'Inter',sans-serif;background:#0f172a;color:#e2e8f0;margin:0;}
.ph{background:linear-gradient(135deg,#1e1b4b,#1e3a5f,#0f172a);padding:20px 32px;border-bottom:1px solid #1e40af;margin-bottom:24px;display:flex;align-items:center;gap:14px;}
.back-btn{background:#1e293b;color:#94a3b8;border:1px solid #334155;padding:7px 16px;border-radius:9px;text-decoration:none;font-size:.82rem;font-weight:600;white-space:nowrap;transition:.18s;}
.back-btn:hover{background:#334155;color:white;}
.cd{background:#1e293b;border:1px solid #334155;border-radius:14px;padding:20px;margin-bottom:14px;}
</style></head><body>
<div class="ph">
  <a href="{% url 'accounts:student_dashboard' %}" class="back-btn"><i class="bi bi-arrow-left me-1"></i>Back</a>
  <h4 style="margin:0;font-size:1.1rem;font-weight:800;color:white;"><i class="bi bi-journal-text me-2" style="color:#a5b4fc;"></i>My Assignments</h4>
</div>
<div class="container pb-5">
  {% for a in assignments %}
  <div class="cd">
    <div class="d-flex justify-content-between align-items-start">
      <div>
        <div style="font-weight:700;color:#e2e8f0;">{{ a.title }}</div>
        <small style="color:#64748b;">{{ a.class_subject.subject.name }} | Due: {{ a.due_date }}</small><br>
        <small style="color:#94a3b8;">{{ a.description|truncatewords:20 }}</small>
      </div>
      <a href="{% url 'assignments:submit' a.pk %}" style="background:#4f46e5;color:white;padding:6px 14px;border-radius:8px;text-decoration:none;font-size:.8rem;font-weight:600;white-space:nowrap;">Submit</a>
    </div>
  </div>
  {% empty %}<p style="color:#475569;text-align:center;padding:40px;">No homework actions yet.</p>{% endfor %}
</div></body></html>
